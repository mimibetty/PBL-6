# domain.yml
version: "3.1"

intents:
  - greet
  - choose_city
  - goodbye

entities:
  - city

slots:
  city:
    type: text
    mappings:
    - type: from_entity
      entity: city

responses:
  utter_greet:
    - text: "Hi! Welcome to my tourism website. I will help you find highly recommended destinations in Vietnam. Please tell me which city you're interested in (e.g., Đà Nẵng, Hà Nội)?"

  utter_goodbye:
    - text: "Goodbye! Have a great trip!"

actions:
  - action_get_destinations

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
